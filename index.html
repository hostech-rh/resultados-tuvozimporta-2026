<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu voz importa — Panel de seguimiento — HOSTECH</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --main:#4563FF; --main-l:#E8ECFF; --main-xl:#F3F5FF;
    --pink:#D01C77; --pink-l:#FCE6F1;
    --cream:#F6F5EC; --ink:#1C1C1A; --ink-mid:#4A4A47;
    --ink-muted:#888780; --border:#E0DFD6; --white:#FFFFFF;
    --good:#3FA66B; --mid:#E0A62B; --bad:#D64545;
    --radius:14px; --radius-sm:8px;
  }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

  /* ---------- Candado ---------- */
  #gate { position:fixed; inset:0; background:var(--cream); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .gate-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:36px 32px; max-width:340px; width:100%; text-align:center; }
  .gate-card .brand-logo { width:40px; height:40px; border-radius:10px; background:var(--main); display:flex; align-items:center; justify-content:center; font-family:'DM Serif Display',serif; font-size:19px; color:var(--white); margin:0 auto 16px; }
  .gate-card h1 { font-family:'DM Serif Display',serif; font-size:20px; margin-bottom:8px; }
  .gate-card p { font-size:13px; color:var(--ink-mid); margin-bottom:20px; line-height:1.5; }
  .gate-card input { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:14px; font-family:inherit; margin-bottom:12px; }
  .gate-card input:focus { outline:none; border-color:var(--main); }
  .gate-card button { width:100%; border:none; border-radius:var(--radius-sm); padding:12px 14px; font-size:14px; font-weight:600; font-family:inherit; background:var(--main); color:var(--white); cursor:pointer; }
  .gate-card button:hover { opacity:0.92; }
  .gate-error { font-size:12px; color:var(--bad); margin-top:10px; display:none; }

  /* ---------- Layout general ---------- */
  #app { display:none; }
  .site-header { background:var(--white); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; flex-wrap:wrap; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-logo { width:32px; height:32px; border-radius:8px; background:var(--main); display:flex; align-items:center; justify-content:center; font-family:'DM Serif Display',serif; font-size:15px; color:var(--white); }
  .brand-name { font-size:13px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
  .brand-dept { font-size:12px; color:var(--ink-muted); }
  .header-right { display:flex; align-items:center; gap:12px; }
  .last-update { font-size:11px; color:var(--ink-muted); }
  .btn-refresh { border:1.5px solid var(--border); background:var(--white); border-radius:20px; padding:7px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; color:var(--ink); }
  .btn-refresh:hover { border-color:var(--main); color:var(--main); }

  .main { max-width:900px; margin:0 auto; padding:28px 20px 64px; }
  .page-title { font-family:'DM Serif Display',serif; font-size:clamp(24px,4vw,30px); margin-bottom:6px; }
  .page-sub { font-size:13px; color:var(--ink-mid); margin-bottom:22px; }

  .card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:18px; }
  .card-tag { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--main); margin-bottom:14px; }
  .card-tag .dot { width:6px; height:6px; border-radius:50%; background:var(--main); }
  .card h2 { font-family:'DM Serif Display',serif; font-size:18px; margin-bottom:4px; }

  /* ---------- Selector de mes / comparar ---------- */
  .vista-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .vista-tab { border:1.5px solid var(--border); background:var(--white); border-radius:12px; padding:9px 16px; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left; line-height:1.25; }
  .vista-tab small { display:block; font-size:10.5px; font-weight:400; color:var(--ink-muted); margin-top:2px; }
  .vista-tab:hover { border-color:var(--main); }
  .vista-tab.active { background:var(--main); border-color:var(--main); color:var(--white); }
  .vista-tab.active small { color:inherit; opacity:0.85; }
  .vista-tab.comparar { border-style:dashed; color:var(--main); }
  .vista-tab.comparar.active { border-style:solid; color:var(--white); }

  /* ---------- Participación ---------- */
  .participacion-grid { display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; }
  @media (max-width:640px) { .participacion-grid { grid-template-columns: 1fr; } }
  .big-number { font-family:'DM Serif Display',serif; font-size:44px; color:var(--main); line-height:1; margin:6px 0 4px; }
  .big-number small { font-family:'DM Sans',sans-serif; font-size:16px; color:var(--ink-muted); font-weight:400; }
  .progress-bar-wrap { background:var(--border); border-radius:10px; height:10px; margin:14px 0 6px; overflow:hidden; }
  .progress-bar-fill { height:100%; border-radius:10px; background:var(--main); transition:width 0.5s ease; }
  .progress-label { font-size:12px; color:var(--ink-mid); }

  .nivel-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .nivel-row:last-child { margin-bottom:0; }
  .nivel-name { font-size:12.5px; width:150px; flex-shrink:0; color:var(--ink-mid); }
  .nivel-bar-wrap { flex:1; background:var(--main-xl); border-radius:8px; height:18px; overflow:hidden; }
  .nivel-bar-fill { height:100%; background:var(--main); border-radius:8px; transition:width 0.5s ease; }
  .nivel-count { font-size:12.5px; font-weight:600; width:60px; text-align:right; flex-shrink:0; }

  /* ---------- Filtro ---------- */
  .filtro-wrap { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .filtro-wrap label { font-size:13px; color:var(--ink-mid); }
  .filtro-wrap select, .cmp-select { font-family:inherit; font-size:13px; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--white); color:var(--ink); }

  /* ---------- Resumen ejecutivo por bloque ---------- */
  .resumen-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  @media (max-width:640px) { .resumen-grid { grid-template-columns: repeat(2, 1fr); } }
  .resumen-card { border:1.5px solid var(--border); border-left:5px solid var(--ink-muted); border-radius:var(--radius-sm); padding:14px 14px; background:var(--white); }
  .resumen-card.verde { border-left-color:var(--good); }
  .resumen-card.amarillo { border-left-color:var(--mid); }
  .resumen-card.rojo { border-left-color:var(--bad); }
  .resumen-nombre { font-size:12.5px; font-weight:600; margin-bottom:6px; }
  .resumen-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; margin-bottom:8px; }
  .resumen-badge .dot-lg { width:9px; height:9px; border-radius:50%; }
  .resumen-badge.verde { color:var(--good); } .resumen-badge.verde .dot-lg { background:var(--good); }
  .resumen-badge.amarillo { color:var(--mid); } .resumen-badge.amarillo .dot-lg { background:var(--mid); }
  .resumen-badge.rojo { color:var(--bad); } .resumen-badge.rojo .dot-lg { background:var(--bad); }
  .resumen-detalle { font-size:11.5px; color:var(--ink-mid); line-height:1.5; }
  .resumen-vs { font-size:11px; color:var(--ink-muted); margin-top:6px; line-height:1.6; }
  .resumen-nota { font-size:11.5px; color:var(--ink-muted); margin-top:14px; font-style:italic; line-height:1.55; }

  /* ---------- Matriz Nivel x Bloque ---------- */
  .foco-banner { background:var(--pink-l); border:1px solid #E9AFCB; border-radius:var(--radius-sm); padding:12px 16px; font-size:13px; color:var(--ink); line-height:1.55; margin-bottom:18px; }
  .foco-banner strong { color:var(--pink); }
  .tabla-matriz-wrap { overflow-x:auto; }
  .tabla-matriz { width:100%; border-collapse:collapse; font-size:11.5px; min-width:560px; }
  .tabla-matriz th, .tabla-matriz td { padding:9px 6px; text-align:center; border-bottom:1px solid var(--border); }
  .tabla-matriz th { font-weight:600; color:var(--ink-mid); font-size:10.5px; }
  .tabla-matriz td:first-child, .tabla-matriz th:first-child { text-align:left; font-weight:500; padding-left:2px; min-width:130px; }
  .matriz-dot { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-size:10px; color:var(--white); font-weight:700; }
  .matriz-dot.verde { background:var(--good); }
  .matriz-dot.amarillo { background:var(--mid); }
  .matriz-dot.rojo { background:var(--bad); }
  .matriz-dot.gris { background:var(--border); color:var(--ink-muted); }
  .matriz-cell-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .matriz-pct { font-size:9.5px; color:var(--ink-muted); }
  .th-sub { display:block; font-weight:400; color:var(--ink-muted); font-size:10px; margin-top:2px; }
  .deep-mark { color:var(--pink); font-size:10px; margin-left:3px; }

  /* ---------- Tendencias (chips de movimiento) ---------- */
  .tend { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .tend.up { background:#E3F4EA; color:#2A7F4F; }
  .tend.down { background:#FBE4E4; color:#B03434; }
  .tend.flat { background:#F1EFE8; color:#77766F; }
  .vs-prev { font-size:11.5px; color:var(--ink-mid); margin:-2px 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---------- Preguntas (barras verticales) ---------- */
  .seccion-titulo { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); margin:26px 2px 12px; display:flex; align-items:center; gap:8px; }
  .seccion-titulo::after { content:''; flex:1; height:1px; background:var(--border); }
  .pregunta-header { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .pregunta-bloque { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--pink); font-weight:600; }
  .pregunta-bloque em { font-style:normal; color:var(--ink-muted); font-weight:500; }
  .pregunta-n { font-size:11px; color:var(--ink-muted); }
  .pregunta-txt { font-size:14.5px; font-weight:500; margin-bottom:10px; line-height:1.4; }
  .pregunta-filtro { margin-bottom:16px; }
  .pregunta-filtro label { font-size:11.5px; color:var(--ink-muted); margin-right:8px; }
  .pregunta-filtro select { font-family:inherit; font-size:12px; padding:5px 10px; border:1.5px solid var(--border); border-radius:20px; background:var(--white); color:var(--ink); }
  .sin-datos { font-size:12.5px; color:var(--ink-muted); font-style:italic; }

  .barras-vert { display:flex; align-items:flex-end; gap:16px; height:150px; margin-bottom:18px; padding:0 4px; }
  .barra-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%; }
  .barra-pct { font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .barra-cuenta { font-size:10.5px; color:var(--ink-muted); margin-bottom:6px; }
  .barra-vert-fill { width:100%; max-width:52px; border-radius:6px 6px 3px 3px; transition:height 0.5s ease; min-height:2px; }
  .barra-op-label { font-size:11.5px; font-weight:600; color:var(--ink-mid); margin-top:8px; }

  .leyenda-opciones { display:flex; flex-direction:column; gap:7px; border-top:1px solid var(--border); padding-top:14px; }
  .leyenda-item { display:flex; gap:9px; align-items:flex-start; font-size:12px; color:var(--ink-mid); line-height:1.4; }
  .leyenda-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:3px; }
  .leyenda-item b { color:var(--ink); font-weight:600; }

  /* ---------- Meta editable ---------- */
  .meta-edit-btn { border:none; background:none; cursor:pointer; color:var(--ink-muted); font-size:13px; margin-left:6px; }
  .meta-edit-btn:hover { color:var(--main); }

  /* ---------- Tendencias en abiertas ---------- */
  .temas-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tema-pill { background:var(--main-xl); border:1px solid var(--main-l); color:var(--main); font-size:12px; font-weight:600; padding:6px 13px; border-radius:20px; }
  .tema-pill span { font-weight:400; color:var(--ink-mid); margin-left:4px; }
  .btn-toggle-abiertas { border:1.5px solid var(--border); background:var(--white); border-radius:20px; padding:8px 16px; font-size:12.5px; font-weight:500; cursor:pointer; font-family:inherit; color:var(--ink); margin-top:6px; }
  .btn-toggle-abiertas:hover { border-color:var(--main); color:var(--main); }
  #lista-abiertas { display:none; margin-top:16px; }
  .abierta-item { border-bottom:1px solid var(--border); padding:12px 0; }
  .abierta-item:last-child { border-bottom:none; }
  .abierta-nivel { font-size:10.5px; text-transform:uppercase; color:var(--ink-muted); letter-spacing:0.04em; margin-bottom:4px; }
  .abierta-txt { font-size:13.5px; line-height:1.55; }

  /* ---------- Comparativo ---------- */
  .cmp-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px; font-size:13px; color:var(--ink-mid); }
  .part-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .part-row:last-child { margin-bottom:0; }
  .part-mes { font-size:12.5px; width:130px; flex-shrink:0; color:var(--ink-mid); line-height:1.3; }
  .part-mes small { display:block; font-size:10.5px; color:var(--ink-muted); }
  .part-bar-wrap { flex:1; background:var(--main-xl); border-radius:8px; height:20px; overflow:hidden; }
  .part-bar-fill { height:100%; background:var(--main); border-radius:8px; }
  .part-num { font-size:12.5px; font-weight:600; width:90px; text-align:right; flex-shrink:0; }
  .part-num small { font-weight:400; color:var(--ink-muted); }

  .mov-grupo { margin-bottom:20px; }
  .mov-grupo:last-child { margin-bottom:0; }
  .mov-grupo-titulo { font-size:12.5px; font-weight:600; margin-bottom:10px; }
  .mov-item { border:1.5px solid var(--border); border-left:5px solid var(--ink-muted); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; background:var(--white); }
  .mov-item.baja { border-left-color:var(--bad); }
  .mov-item.sube { border-left-color:var(--good); }
  .mov-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .mov-txt { font-size:13.5px; font-weight:500; line-height:1.4; margin-bottom:6px; }
  .mov-nums { font-size:12px; color:var(--ink-mid); line-height:1.6; }
  .mov-estables { font-size:12px; color:var(--ink-muted); line-height:1.6; }

  .tabla-cmp { width:100%; border-collapse:collapse; font-size:12px; }
  .tabla-cmp th, .tabla-cmp td { padding:10px 6px; text-align:center; border-bottom:1px solid var(--border); }
  .tabla-cmp th { font-size:11px; font-weight:600; color:var(--ink-mid); }
  .tabla-cmp td:first-child, .tabla-cmp th:first-child { text-align:left; font-weight:500; padding-left:2px; }
  .celda-prot { font-size:10.5px; color:var(--ink-muted); font-style:italic; }
  .celda-n { display:block; font-size:10px; color:var(--ink-muted); margin-top:2px; }


  /* ---------- Respuestas abiertas: temas, tono, alertas ---------- */
  .tono-bar { display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--border); margin:2px 0 8px; }
  .tono-leyenda { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--ink-mid); margin-bottom:6px; }
  .tono-leyenda i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .tema-lista { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
  .tema-card { border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
  .tema-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .tema-nombre { font-size:14px; font-weight:600; }
  .tema-chip { display:inline-block; font-size:10px; font-weight:500; color:var(--pink); background:var(--pink-l); border-radius:20px; padding:2px 9px; margin-left:4px; letter-spacing:0.02em; }
  .tema-n { font-size:12px; color:var(--ink-mid); }
  .tema-sug { font-size:12px; color:var(--ink-mid); margin:2px 0 8px; }
  .tema-ej { font-size:12.5px; color:var(--ink-mid); line-height:1.55; border-left:3px solid var(--main-l); padding:2px 0 2px 10px; margin:6px 0; font-style:italic; }
  .tema-nota { font-size:11.5px; color:var(--ink-muted); margin-top:8px; line-height:1.5; }
  .idea-item { font-size:13px; line-height:1.6; color:var(--ink-mid); padding:10px 0; border-bottom:1px solid var(--border); }
  .idea-item:last-child { border-bottom:none; }
  .alerta-card { border-color:#F0B8B4; }
  .alerta-item { border:1.5px solid var(--border); border-left:5px solid var(--mid); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; }
  .alerta-item.alta { border-left-color:var(--bad); background:#FFFAFA; }
  .alerta-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .alerta-chip { font-size:10.5px; font-weight:600; padding:2px 9px; border-radius:20px; }
  .alerta-chip.alta { background:#FBE4E4; color:#B03434; }
  .alerta-chip.media { background:#FFF1CF; color:#8A6410; }

  .mes-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid; border-radius:20px; padding:3px 11px; font-size:12px; font-weight:600; line-height:1.3; }
  .mes-chip i { display:inline-block; width:8px; height:8px; border-radius:50%; }

  .privacy-note { background:var(--cream); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; font-size:11.5px; color:var(--ink-mid); line-height:1.6; margin-top:20px; }
  .error-box { background:#FCEBEA; border:1px solid #F0B8B4; border-radius:var(--radius-sm); padding:14px 16px; font-size:13px; color:#8A2E2E; }
  .aviso-box { background:#FFF7E0; border:1px solid #F0D98A; border-radius:var(--radius-sm); padding:14px 16px; font-size:13px; color:#6B5410; line-height:1.55; }
  .loading { text-align:center; padding:40px 0; color:var(--ink-muted); font-size:13px; }
</style>
</head>
<body>

<!-- ============ CANDADO ============ -->
<div id="gate">
  <div class="gate-card">
    <div class="brand-logo">H</div>
    <h1>Tu voz importa</h1>
    <p>Panel de seguimiento — acceso restringido a Recursos Humanos y Dirección General.</p>
    <input type="password" id="gate-input" placeholder="Contraseña" autocomplete="off">
    <button onclick="checkPassword()">Entrar</button>
    <p class="gate-error" id="gate-error">Contraseña incorrecta, inténtalo de nuevo.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="site-header">
    <div class="brand">
      <div class="brand-logo">H</div>
      <div>
        <div class="brand-name">Tu voz importa</div>
        <div class="brand-dept" id="brand-dept">Panel de seguimiento</div>
      </div>
    </div>
    <div class="header-right">
      <span class="last-update" id="last-update">—</span>
      <button class="btn-refresh" onclick="cargarDatos()">↻ Actualizar</button>
    </div>
  </div>

  <div class="main">
    <div id="content-area">
      <div class="loading">Cargando datos…</div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIGURACIÓN — edita aquí si algo cambia
// ─────────────────────────────────────────────
const DASHBOARD_PASSWORD = 'hostech-rh-2026';   // contraseña para ver el panel
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNHeokK808clIxbqB1Li6qi9MrgInZM9qf_-gdMOmJ3UxB-OsMKtAFlr0sWXvk6jHR/exec';
const CLAVE_SECRETA = 'hostech-pulso-2026';     // debe coincidir con la del Apps Script
const META_RESPUESTAS_DEFAULT = 110;             // total de colaboradores en HOSTECH (valor inicial)
const MIN_N_NIVEL = 5;                           // grupos con menos personas no se muestran en comparativos (anonimato)
const UMBRAL_MOVIMIENTO = 10;                    // puntos porcentuales para considerar que algo "se movió"

}

// ─────────────────────────────────────────────
function campo(r, nombres) {
  const keys = Object.keys(r);
  for (const n of nombres) {
    const k = keys.find(k => norm(k) === n);
    if (k !== undefined) {
      const v = r[k];
      if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
    }
  }
  return '';
}

function mesInfo(y, i) { return { orden: y * 100 + i + 1, label: MESES_TXT[i] + ' ' + y }; }
function parseMes(raw) {
  const t = norm(raw);
  if (!t) return null;
  let m = t.match(/([a-z]+)\s*(?:de\s*)?(\d{4})/);
  if (m) {
    const nombre = m[1] === 'setiembre' ? 'septiembre' : m[1];
    const i = MESES.indexOf(nombre);
    if (i >= 0) return mesInfo(+m[2], i);
  }
  m = t.match(/(\d{4})-(\d{1,2})/);
  if (m && +m[2] >= 1 && +m[2] <= 12) return mesInfo(+m[1], +m[2] - 1);
  return null;
}

const COLUMNAS_NO_PREGUNTA = ['respuesta abierta','abierta','nivel de puesto','nivel','mes','ciclo','bloque','fecha'];

function procesarFila(r) {
  const resp = {};   // { qid: índice de opción elegida (0 = la más positiva) }
  Object.keys(r).forEach(k => {
    if (COLUMNAS_NO_PREGUNTA.includes(norm(k))) return;
    const v = r[k];
    if (typeof v !== 'string' || !v.trim()) return;
    const hit = MAPA_OPCIONES.get(norm(v));
    if (hit && resp[hit.qid] === undefined) resp[hit.qid] = hit.idx;
  });

  const nivelRaw = norm(campo(r, ['nivel de puesto', 'nivel']));
  const nivel = NIVELES.some(n => n.key === nivelRaw) ? nivelRaw : 'sin-clasificar';

  // Bloque profundo: el que tiene más preguntas respondidas en esa fila (respaldo: columna Bloque)
  const cuentas = {};
  Object.keys(resp).forEach(qid => { const b = Q[qid].bloque; cuentas[b] = (cuentas[b] || 0) + 1; });
  let bloque = null, max = 0;
  BLOQUES_ORDEN.forEach(b => { if ((cuentas[b] || 0) > max) { max = cuentas[b]; bloque = b; } });
  if (max < 3) {
    const col = campo(r, ['bloque']);
    bloque = BLOQUES_ORDEN.find(b => norm(b) === norm(col)) || null;
  }

  return {
    resp, nivel, bloque,
    mes: parseMes(campo(r, ['mes'])),
    ciclo: campo(r, ['ciclo']),
    abierta: campo(r, ['respuesta abierta', 'abierta'])
  };
}

const COLOR_DEFECTO = { main: '#4563FF', l: '#C5CCFF', xl: '#E8ECFF', tinta: '#FFFFFF' };
function colorDe(prog) {
  return prog && prog.color ? { main: prog.color, l: prog.colorL, xl: prog.colorXl, tinta: prog.tinta || '#FFFFFF' } : COLOR_DEFECTO;
}
function oscurecer(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(x => Math.round(x * (1 - f)).toString(16).padStart(2, '0')).join('');
}
// Etiqueta con el color del mes (texto oscuro para que se lea bien también con el amarillo)
function chipMes(p, txt) {
  const c = p.col;
  return `<span class="mes-chip" style="background:${c.xl}; border-color:${c.l}; color:${oscurecer(c.main, 0.4)};"><i style="background:${c.main}"></i>${escapeHtml(txt || p.label.split(' ')[0])}</span>`;
}
// Encabezado de tabla con el color del mes
function thMes(p, sub) {
  const c = p.col;
  return `<th style="background:${c.xl}; border-bottom:3px solid ${c.main}; color:${oscurecer(c.main, 0.4)};">${escapeHtml(p.label.split(' ')[0])}${sub ? `<span class="th-sub">${sub}</span>` : ''}</th>`;
}

function moda(arr) {
  const c = {};
  arr.filter(Boolean).forEach(x => { c[x] = (c[x] || 0) + 1; });
  const e = Object.entries(c).sort((a, b) => b[1] - a[1]);
  return e.length ? e[0][0] : null;
}

let AGRUPADO = { porMes: 0, porBloque: 0, sinIdentificar: 0 };

function construirPulsos(respuestas) {
  AGRUPADO = { porMes: 0, porBloque: 0, sinIdentificar: 0 };
  const filas = respuestas.map(procesarFila);
  const grupos = new Map();

  filas.forEach(f => {
    let info = f.mes, esOtro = false;
    if (info) AGRUPADO.porMes++;
    else {
      // Respaldo: fila sin mes → se ubica por su bloque profundo según el calendario del programa
      const prog = PROGRAMA.find(p => p.bloque === f.bloque);
      if (prog) { info = parseMes(prog.mes); AGRUPADO.porBloque++; }
      else if (f.bloque) { info = { orden: 900 + BLOQUES_ORDEN.indexOf(f.bloque), label: 'Pulso · ' + f.bloque }; AGRUPADO.porBloque++; }
      else { info = { orden: 1, label: 'Sin identificar' }; esOtro = true; AGRUPADO.sinIdentificar++; }
    }
    if (!grupos.has(info.orden)) grupos.set(info.orden, { key: String(info.orden), orden: info.orden, label: info.label, esOtro, filas: [] });
    grupos.get(info.orden).filas.push(f);
  });

  const pulsos = [...grupos.values()].sort((a, b) => a.orden - b.orden);
  pulsos.forEach(p => {
    const prog = PROGRAMA.find(x => { const i = parseMes(x.mes); return i && i.orden === p.orden; });
    p.bloque = moda(p.filas.map(f => f.bloque)) || (prog ? prog.bloque : null);
    p.ciclo = moda(p.filas.map(f => f.ciclo)) || (prog ? prog.ciclo : '');
    p.col = colorDe(prog);
    const qids = new Set();
    p.filas.forEach(f => Object.keys(f.resp).forEach(q => qids.add(q)));
    p.qids = CATALOGO.map(q => q.id).filter(id => qids.has(id));
  });
  return pulsos;
}

// ─────────────────────────────────────────────
function colorPorAvg(avg) { return avg <= 1 ? 'verde' : avg <= 2 ? 'amarillo' : 'rojo'; }

function statsIdx(indices) {
  const n = indices.length;
  if (n === 0) return { n: 0 };
  const avg = indices.reduce((a, x) => a + x, 0) / n;
  return {
    n, avg,
    pctPositivo: Math.round(indices.filter(i => i <= 1).length / n * 100),
    pctAlerta: Math.round(indices.filter(i => i === 3).length / n * 100),
    color: colorPorAvg(avg)
  };
}
const idxDe = (filas, qid) => filas.map(f => f.resp[qid]).filter(v => v !== undefined);
const statsPregunta = (filas, qid) => statsIdx(idxDe(filas, qid));
function statsBloque(filas, bloque) {
  const idx = CATALOGO.filter(q => q.bloque === bloque).flatMap(q => idxDe(filas, q.id));
  return Object.assign(statsIdx(idx), { nombre: bloque });
}
const calcularResumenBloques = filas => BLOQUES_ORDEN.map(b => statsBloque(filas, b));

function calcularMatrizNivelBloque(filas) {
  const out = NIVELES.map(nivel => {
    const fn = filas.filter(f => f.nivel === nivel.key);
    const bloques = calcularResumenBloques(fn);
    return { nivel: nivel.label, bloques, totalRespuestas: fn.length,
      rojos: bloques.filter(b => b.color === 'rojo').length,
      amarillos: bloques.filter(b => b.color === 'amarillo').length };
  });
  out.sort((a, b) => (b.rojos - a.rojos) || (b.amarillos - a.amarillos));
  return out;
}

function nivelLabel(key) {
  const f = NIVELES.find(n => n.key === key);
  return f ? f.label : 'Sin clasificar';
}

function deltaChip(d) {
  const a = Math.abs(d);
  if (a < UMBRAL_MOVIMIENTO) return `<span class="tend flat">≈ ${d > 0 ? '+' : d < 0 ? '−' : ''}${a} pts · estable</span>`;
  return d > 0 ? `<span class="tend up">▲ +${a} pts</span>` : `<span class="tend down">▼ −${a} pts</span>`;
}

let PULSOS = [];
const pulsosOk = () => PULSOS.filter(p => !p.esOtro);

// Busca el pulso anterior (más cercano hacia atrás) donde esa pregunta sí se hizo
function pulsoPrevioCon(p, qid) {
  const lista = pulsosOk();
  const i = lista.indexOf(p);
  for (let j = i - 1; j >= 0; j--) if (statsPregunta(lista[j].filas, qid).n > 0) return lista[j];
  return null;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// Palabras de tono
const POS_EXACTO = new Set(['bien','bueno','buena','buenos','buenas','excelente','excelentes','genial','feliz','felices','contento','contenta','contentos','mejoro','mejoraron','unidos','unido','buen']);
const POS_PREFIJO = ['agradec','agradezc','content','orgullos','motivad','comod','satisf','apoy','confian','respet','reconoc','valorad','valoran','felicit','excelen','gust','ayud','flexib','amable','cercan','colaboraci','cordial','alegr','tranquil','respald','escuch','disfrut','aprecio','cuidan','encant','companerism','admir','agrad'];
const NEG_EXACTO = new Set(['mal','malo','mala','malos','malas','tarde','lento','lentos','harto','hartos','peor','pesa']);
const NEG_PREFIJO = ['pesim','terribl','horribl','dificil','cansad','cansanc','agotad','agotam','estres','presion','molest','frustr','decepcion','desmotiv','injust','sobrecarg','saturad','desorden','desorganiz','caos','abandon','ignor','desapercib','problem','quej','preocup','inseguri','inseguro','miedo','temor','incomod','toxic','hostil','favoritis','grit','desigual','insuficien','deficien','confus','tension','conflict','desgast','apagando','incendio','urgen','retras','pesad','abrum','ansied','sobrepas','desbord','descuid','estancad'];
const NEGADORES = new Set(['no','nunca','ni','nada','tampoco','sin','jamas','ninguno','ninguna','ningun','falta','faltan','falto','carece','carecemos','carecen','poco','poca','pocos','pocas']);
const HUECO = new Set(['falta','faltan','falto','carece','carecemos','carecen']);
const CUES_SUGERENCIA = /\b(seria (?:bueno|genial|mejor|importante|util|excelente|ideal)|estaria (?:bien|genial|mejor)|me gustaria|ojala|deberian?|podrian?|ayudaria|mejoraria|facilitaria|serviria|permitiria|al menos|seria(?= )|sugiero|sugerimos|(?<!cuando )(?<!si )propongo|recomiendo|convendria|hace falta|haria falta|vendria bien|necesitamos mas|necesitariamos)\b/g;
const QUEJAS = /\b(demasiad[oa]s?|no (?:me |nos )?alcanza(?:n)?|no (?:me |nos )?da(?:n)? (?:el )?tiempo|no (?:me |nos )?doy abasto|me llevo pendientes|sin descanso|no (?:hay|existe|existen) (?:oportunidad\w*|crecimiento|desarrollo|espacio\w*|comunicacion|claridad|apoyo|reconocimiento)|cambia(?:n)? (?:las |los |de )?(?:prioridades|planes|instrucciones|criterios)|nadie (?:nos |me )?(?:explica|dice|informa|avisa|escucha|apoya)|no (?:nos |me )?(?:explican|dicen|informan|avisan|escuchan|toman en cuenta)|por debajo del mercado|no (?:me |nos )?(?:han )?pag\w*|sueldo (?:bajo|insuficiente)|poco (?:sueldo|dinero)|siempre lo mismo|nos enteramos (?:tarde|por rumores))\b/g;
const SEPARADORES = /(?<=[.!?;])\s+|\n+|\s+(?:pero|aunque|sin embargo|no obstante|por otro lado|aun asi)\s+/i;

const limpiar = s => norm(s).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const empiezaCon = (t, lista) => lista.some(p => t.startsWith(p));

function puntuarSegmento(segNorm) {
  const tieneSug = new RegExp(CUES_SUGERENCIA.source).test(segNorm);
  const tokens = segNorm.replace(CUES_SUGERENCIA, ' sug ').split(' ').filter(Boolean);
  let pos = 0, neg = 0, hueco = false;
  tokens.forEach((t, i) => {
    if (HUECO.has(t)) hueco = true;
    const esPos = POS_EXACTO.has(t) || empiezaCon(t, POS_PREFIJO);
    const esNeg = (NEG_EXACTO.has(t) && !(t === 'tarde' && ['la','esta','en','por','de','buenas'].includes(tokens[i - 1]))) || empiezaCon(t, NEG_PREFIJO);
    if (!esPos && !esNeg) return;
    const negada = tokens.slice(Math.max(0, i - 3), i).some(w => NEGADORES.has(w));
    if (esPos) { if (negada) neg++; else pos++; }
    else if (!negada) neg++;          // "no es malo" se neutraliza
  });
  neg += Math.min(2, (segNorm.match(QUEJAS) || []).length);
  if (hueco && neg === 0) neg = 1;    // "falta tiempo", "faltan manos": señala una carencia
  return { pos, neg, tieneSug };
}

function analizarComentario(texto) {
  const original = String(texto || '').trim();
  const segs = original.split(SEPARADORES).map(s => s.trim()).filter(s => s.length > 2).map(txt => {
    const n = limpiar(txt);
    const pt = puntuarSegmento(n);
    let sent = pt.pos > pt.neg ? 'positivo' : pt.neg > pt.pos ? 'negativo' : (pt.pos > 0 ? 'mixto' : 'neutral');
    if (pt.tieneSug && pt.neg === 0) sent = 'neutral';   // un deseo o propuesta sin queja explícita
    return { txt, sent, sug: pt.tieneSug, mag: pt.pos + pt.neg, temas: TEMAS.filter(t => t.re.test(n)).map(t => t.id) };
  });

  const hayPos = segs.some(s => s.sent === 'positivo' || s.sent === 'mixto');
  const hayNeg = segs.some(s => s.sent === 'negativo' || s.sent === 'mixto');
  const sent = hayPos && hayNeg ? 'mixto' : hayPos ? 'positivo' : hayNeg ? 'negativo' : 'neutral';

  const temas = {};
  segs.forEach(s => s.temas.forEach(id => {
    const t = temas[id] || (temas[id] = { pos: false, neg: false, sug: false, ejemplo: null });
    if (s.sent === 'positivo' || s.sent === 'mixto') t.pos = true;
    if (s.sent === 'negativo' || s.sent === 'mixto') t.neg = true;
    if (s.sug) t.sug = true;
    if (!t.ejemplo || s.mag > t.ejemplo.mag || (s.mag === t.ejemplo.mag && s.txt.length < t.ejemplo.txt.length)) t.ejemplo = s;
  }));
  Object.keys(temas).forEach(id => {
    const t = temas[id];
    t.sent = t.pos && t.neg ? 'mixto' : t.pos ? 'positivo' : t.neg ? 'negativo' : 'neutral';
  });

  const todo = limpiar(original);
  const alertas = ALERTAS.filter(a => {
    const m = a.re.exec(todo);
    if (!m) return false;
    if (a.negable && /\b(no|nunca|ni|sin|ningun\w*)(?: \w+){0,2} $/.test(todo.slice(Math.max(0, m.index - 24), m.index))) return false;
    return true;
  });
  return { segs, sent, sug: segs.some(s => s.sug), temas, alertas };
}

function analisisFila(f) { return f._an || (f._an = analizarComentario(f.abierta)); }

function resumenAbiertas(filas) {
  const conTexto = filas.filter(f => f.abierta && f.abierta.trim());
  const tono = { positivo: 0, mixto: 0, negativo: 0, neutral: 0 };
  const porTema = {};
  TEMAS.forEach(t => { porTema[t.id] = { t, n: 0, positivo: 0, mixto: 0, negativo: 0, neutral: 0, sug: 0, ejemplos: [] }; });
  const ideas = [];
  conTexto.forEach(f => {
    const an = analisisFila(f);
    tono[an.sent]++;
    Object.entries(an.temas).forEach(([id, info]) => {
      const T = porTema[id];
      T.n++; T[info.sent]++; if (info.sug) T.sug++;
      if (info.ejemplo) T.ejemplos.push(info.ejemplo);
    });
    an.segs.filter(s => s.sug).forEach(s => ideas.push(s));
  });
  const temas = Object.values(porTema).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  return { n: conTexto.length, tono, temas, porTema, ideas, sugerencias: conTexto.filter(f => analisisFila(f).sug).length };
}

function alertasDePulso(p) {
  const peso = a => a.alertas.some(x => x.nivel === 'alta') ? 2 : 1;
  return p.filas.filter(f => f.abierta && f.abierta.trim()).map(f => ({ f, an: analisisFila(f) }))
    .filter(x => x.an.alertas.length).sort((a, b) => peso(b.an) - peso(a.an));
}

function recorte(txt, max) {
  max = max || 170;
  if (txt.length <= max) return txt;
  const c = txt.slice(0, max);
  return c.slice(0, Math.max(c.lastIndexOf(' '), 60)) + '…';
}

// ───────────── Respuestas abiertas: vista de un mes ─────────────
const SENT_INFO = {
  positivo: { txt: 'Positivos', c: '#3FA66B' },
  mixto:    { txt: 'Mixtos', c: '#E0A62B' },
  negativo: { txt: 'Con queja', c: '#D64545' },
  neutral:  { txt: 'Neutros o propuestas', c: '#B8B7AE' }
};
const ORDEN_SENT = ['positivo', 'mixto', 'negativo', 'neutral'];

function barraTono(t, n) {
  if (!n) return '';
  return `<div class="tono-bar">${ORDEN_SENT.filter(k => t[k]).map(k => `<div style="width:${t[k] / n * 100}%; background:${SENT_INFO[k].c}"></div>`).join('')}</div>
    <div class="tono-leyenda">${ORDEN_SENT.filter(k => t[k]).map(k => `<span><i style="background:${SENT_INFO[k].c}"></i>${SENT_INFO[k].txt}: <strong>${t[k]}</strong> (${Math.round(t[k] / n * 100)}%)</span>`).join('')}</div>`;
}

// El nivel de puesto solo se muestra si el grupo es lo bastante grande para no identificar a nadie
function nivelVisible(p, f) {
  if (f.nivel === 'sin-clasificar') return 'Sin clasificar';
  const n = p.filas.filter(x => x.nivel === f.nivel).length;
  return n >= MIN_N_NIVEL ? nivelLabel(f.nivel) : 'Nivel no mostrado (grupo pequeño)';
}

function htmlAlertas(p) {
  if (!p.filas.some(f => f.abierta && f.abierta.trim())) return '';
  const al = alertasDePulso(p);
  if (!al.length) {
    return `<div class="card"><div class="card-tag"><span class="dot"></span>Para leer con cuidado</div>
      <div class="sin-datos">La lectura automática no detectó comentarios con señales de alerta este mes. No sustituye leer los comentarios completos.</div></div>`;
  }
  const hayCritico = al.some(x => x.an.alertas.some(a => a.id === 'bienestar-critico'));
  return `<div class="card alerta-card">
    <div class="card-tag" style="color:var(--bad);"><span class="dot" style="background:var(--bad);"></span>Para leer con cuidado (${al.length})</div>
    <h2 style="margin-bottom:6px;">Comentarios que conviene revisar</h2>
    <div class="resumen-nota" style="margin:0 0 14px;">Son comentarios donde aparecen temas sensibles (trato, salud, pagos, posible salida…). Es una lectura automática: puede marcar de más o quedarse corta, por eso conviene leerlos completos y con calma.</div>
    ${hayCritico ? `<div class="aviso-box" style="margin-bottom:14px;">Uno de los comentarios sugiere que alguien podría estar pasando por un momento muy difícil. Como las respuestas son anónimas no se puede buscar a la persona, pero vale la pena pensar cómo hacer más visibles los apoyos disponibles para todos.</div>` : ''}
    ${al.map(({ f, an }) => `<div class="alerta-item ${an.alertas.some(a => a.nivel === 'alta') ? 'alta' : 'media'}">
      <div class="alerta-chips">${an.alertas.map(a => `<span class="alerta-chip ${a.nivel}">${a.nivel === 'alta' ? 'Prioridad' : 'Atención'} · ${escapeHtml(a.tipo)}</span>`).join('')}</div>
      <div class="abierta-txt">${escapeHtml(f.abierta)}</div>
      <div class="abierta-nivel" style="margin:6px 0 0;">${escapeHtml(nivelVisible(p, f))}</div>
    </div>`).join('')}
  </div>`;
}

function htmlTemas(res, p) {
  let lista = res.temas.filter(x => x.n >= 2);
  if (lista.length < 3) lista = res.temas.slice(0, 3);
  lista = lista.slice(0, 8);
  return lista.map(x => {
    const t = x.t;
    const ej = [...x.ejemplos].sort((a, b) => b.mag - a.mag || a.txt.length - b.txt.length).slice(0, 2);
    let nota = '';
    if (t.bloque) {
      const s = statsBloque(p.filas, t.bloque);
      if (s.n && s.color !== 'verde' && (x.negativo + x.mixto) >= 2) nota = `<div class="tema-nota">Coincide con el semáforo de <strong>${t.bloque}</strong> (${s.color === 'rojo' ? '🔴 alerta' : '🟡 atención'}).</div>`;
    } else if (x.n >= 2) {
      nota = `<div class="tema-nota">Este tema <strong>no está en el banco de preguntas</strong>: aparece solo por lo que la gente escribe.</div>`;
    }
    return `<div class="tema-card">
      <div class="tema-top">
        <div class="tema-nombre">${t.nombre} <span class="tema-chip">${t.bloque || 'Fuera del banco'}</span></div>
        <div class="tema-n"><strong>${x.n}</strong> comentario${x.n === 1 ? '' : 's'} · ${Math.round(x.n / res.n * 100)}%</div>
      </div>
      ${barraTono({ positivo: x.positivo, mixto: x.mixto, negativo: x.negativo, neutral: x.neutral }, x.n)}
      ${x.sug ? `<div class="tema-sug">💡 ${x.sug} comentario${x.sug === 1 ? '' : 's'} con una idea o propuesta</div>` : ''}
      ${ej.map(e => `<div class="tema-ej">“${escapeHtml(recorte(e.txt))}”</div>`).join('')}
      ${nota}
    </div>`;
  }).join('');
}

function htmlAbiertas(p, filtradas) {
  const res = resumenAbiertas(filtradas);
  let html = htmlAlertas(p);

  html += `<div class="card">
    <div class="card-tag"><span class="dot"></span>Respuestas abiertas (${res.n})</div>
    <h2 style="margin-bottom:4px;">Lo que dicen los comentarios</h2>`;
  if (!res.n) {
    return html + `<div class="sin-datos" style="margin-top:8px;">Aún no hay comentarios abiertos con el filtro actual.</div></div>`;
  }
  html += `<div class="resumen-nota" style="margin:0 0 16px;">Lectura automática de los comentarios: agrupa por tema y mide el tono de cada idea (un mismo comentario puede hablar bien de un tema y mal de otro). Es una guía para orientar la conversación; no sustituye leer los comentarios.</div>
    ${barraTono(res.tono, res.n)}
    <div class="tema-lista">${htmlTemas(res, p)}</div>
  </div>`;

  // Ideas que proponen
  const vistas = new Set();
  const ideas = res.ideas.filter(s => { const k = s.txt.toLowerCase(); if (vistas.has(k)) return false; vistas.add(k); return true; })
    .sort((a, b) => a.txt.length - b.txt.length).slice(0, 6);
  if (ideas.length) {
    html += `<div class="card">
      <div class="card-tag"><span class="dot"></span>Ideas que proponen</div>
      <h2 style="margin-bottom:4px;">Lo que la gente sugiere, en sus palabras</h2>
      <div class="resumen-nota" style="margin:0 0 12px;">Buen punto de partida para conversarlo con los líderes: quien lo vive, sabe cómo mejorarlo.</div>
      ${ideas.map(s => `<div class="idea-item">“${escapeHtml(recorte(s.txt, 220))}”${s.temas[0] ? ` <span class="tema-chip">${TEMAS.find(t => t.id === s.temas[0]).nombre}</span>` : ''}</div>`).join('')}
    </div>`;
  }

  // Todos los comentarios
  const abiertas = filtradas.filter(f => f.abierta && f.abierta.trim());
  html += `<div class="card">
    <div class="card-tag"><span class="dot"></span>Comentarios completos</div>
    <button class="btn-toggle-abiertas" onclick="toggleAbiertas()" id="btn-toggle-abiertas" style="margin-top:0;">Ver las ${abiertas.length} respuestas completas</button>
    <div id="lista-abiertas">
      ${abiertas.map(f => { const an = analisisFila(f);
        const temasTxt = Object.keys(an.temas).slice(0, 3).map(id => `<span class="tema-chip">${TEMAS.find(t => t.id === id).nombre}</span>`).join(' ');
        return `<div class="abierta-item">
          <div class="abierta-nivel">${escapeHtml(nivelVisible(p, f))} · <span style="color:${SENT_INFO[an.sent].c}; font-weight:600;">${SENT_INFO[an.sent].txt.replace('Con queja', 'Con queja').replace('Neutros o propuestas', 'Neutro / propuesta')}</span>${an.alertas.length ? ' · <span style="color:var(--bad); font-weight:600;">Para leer con cuidado</span>' : ''}</div>
          <div class="abierta-txt">${escapeHtml(f.abierta)}</div>
          ${temasTxt ? `<div style="margin-top:6px;">${temasTxt}</div>` : ''}
        </div>`; }).join('')}
    </div>
  </div>`;
  return html;
}

// ───────────── Respuestas abiertas: comparar meses ─────────────
function comparativoAbiertas(ok, A, B) {
  const res = ok.map(p => ({ p, r: resumenAbiertas(p.filas), al: alertasDePulso(p) }));
  const pocos = res.filter(x => x.r.n < MIN_COMENTARIOS);
  const totalPorTema = {};
  TEMAS.forEach(t => { totalPorTema[t.id] = res.reduce((a, x) => a + x.r.porTema[t.id].n, 0); });
  const ultimo = res[res.length - 1].r;
  const temasMostrar = TEMAS.filter(t => totalPorTema[t.id] >= 2 || res.some(x => x.r.porTema[t.id].n >= 2))
    .sort((a, b) => (ultimo.porTema[b.id].n - ultimo.porTema[a.id].n) || (totalPorTema[b.id] - totalPorTema[a.id])).slice(0, 10);

  let html = `<div class="card"><div class="card-tag"><span class="dot"></span>Respuestas abiertas</div>
    <h2 style="margin-bottom:4px;">Cómo cambia la conversación, mes a mes</h2>
    <div class="resumen-nota" style="margin:0 0 14px;">Para cada tema se muestra en qué % de los comentarios del mes aparece. ${pocos.length ? `<strong>Ojo:</strong> ${pocos.map(x => escapeHtml(x.p.label.split(' ')[0])).join(' y ')} ${pocos.length === 1 ? 'tiene' : 'tienen'} pocos comentarios (menos de ${MIN_COMENTARIOS}), así que los % son solo una pista.` : ''}</div>
    <div class="tabla-matriz-wrap"><table class="tabla-cmp">
      <thead><tr><th>&nbsp;</th>${res.map(x => thMes(x.p, `${x.r.n} comentario${x.r.n === 1 ? '' : 's'}`)).join('')}</tr></thead>
      <tbody>
        <tr><td>Tono general</td>${res.map(x => `<td>${x.r.n ? `${barraTono(x.r.tono, x.r.n).split('<div class="tono-leyenda">')[0]}<span class="celda-n">${Math.round((x.r.tono.negativo + x.r.tono.mixto) / x.r.n * 100)}% con alguna queja</span>` : '–'}</td>`).join('')}</tr>
        <tr><td>Para leer con cuidado</td>${res.map(x => `<td>${x.al.length ? `<strong style="color:var(--bad);">${x.al.length}</strong>` : '0'}</td>`).join('')}</tr>
        ${temasMostrar.map(t => {
          let prev = null;
          return `<tr><td>${t.nombre}<span class="th-sub" style="text-align:left;">${t.bloque || 'Fuera del banco'}</span></td>${res.map(x => {
            const n = x.r.porTema[t.id].n;
            const pct = x.r.n ? Math.round(n / x.r.n * 100) : 0;
            let chip = '';
            if (prev && prev.r.n >= MIN_COMENTARIOS && x.r.n >= MIN_COMENTARIOS) chip = deltaChip(pct - Math.round(prev.r.porTema[t.id].n / prev.r.n * 100));
            prev = x;
            const queja = x.r.porTema[t.id].negativo + x.r.porTema[t.id].mixto;
            return `<td>${n ? `<strong>${pct}%</strong><span class="celda-n">${n} comentario${n === 1 ? '' : 's'}${queja ? ` · ${queja} con queja` : ''}</span>${chip}` : '<span class="celda-prot">–</span>'}</td>`;
          }).join('')}</tr>`;
        }).join('')}
      </tbody></table></div>`;

  // Temas que aparecen / dejan de aparecer entre los dos meses elegidos
  const rA = resumenAbiertas(A.filas), rB = resumenAbiertas(B.filas);
  const nuevos = TEMAS.filter(t => rB.porTema[t.id].n >= 2 && rA.porTema[t.id].n === 0);
  const idos = TEMAS.filter(t => rA.porTema[t.id].n >= 2 && rB.porTema[t.id].n === 0);
  if (nuevos.length || idos.length) {
    html += `<div style="margin-top:16px; font-size:12.5px; color:var(--ink-mid); line-height:1.7;">
      ${nuevos.length ? `<div><strong>Aparece en</strong> ${chipMes(B)} <strong>y no en</strong> ${chipMes(A)}<strong>:</strong> ${nuevos.map(t => t.nombre).join(', ')}.</div>` : ''}
      ${idos.length ? `<div><strong>Estaba en</strong> ${chipMes(A)} <strong>y ya no aparece en</strong> ${chipMes(B)}<strong>:</strong> ${idos.map(t => t.nombre).join(', ')}.</div>` : ''}
    </div>`;
  }
  return html + `</div>`;
}

// DATOS DE EJEMPLO (solo si no hay conexión) — dos meses para ver el diseño

function generarDatosEjemplo() {
  const niveles = ['directivo','mando-medio','operativo','operativo','operativo','prefiero-no'];
  const pesos = (sesgo) => { const w = [4 - sesgo, 3, 2 + sesgo * 0.5, 1 + sesgo]; return w; };
  const azar = (w) => { const t = w.reduce((a, b) => a + b, 0); let r = Math.random() * t; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return 3; };
  const meses = [
    { mes: 'Agosto 2026', bloque: 'Orgullo', n: 52, orden: ['E1','E2','E3','E4','E5','B1','F1','C1','D1','A1'], sesgo: { B1: 0.6, D1: 1.4 } },
    { mes: 'Septiembre 2026', bloque: 'Carga y bienestar', n: 61, orden: ['B1','B2','B3','B4','B5','E1','F1','C1','D1','A1'], sesgo: { B1: 1.4, B4: 1.2, D1: 1.0, E1: 0.4 } }
  ];
  const abiertas = ['Sería bueno tener más reconocimiento cuando se cumplen las metas del mes.','Me gustaría que hubiera más comunicación entre áreas, a veces la información llega tarde.','La carga se siente pesada en cierre de mes, falta apoyo en esos días.','Falta comunicación clara sobre los proyectos nuevos que se están armando.','Hace falta más reconocimiento al trabajo del equipo operativo.'];
  const datos = [];
  meses.forEach(m => {
    for (let i = 0; i < m.n; i++) {
      const fila = { 'Mes': m.mes, 'Ciclo': 'Ciclo 1', 'Bloque': m.bloque, 'Nivel de puesto': niveles[i % niveles.length] };
      m.orden.forEach((qid, k) => { fila['P' + (k + 1)] = Q[qid].opciones[azar(pesos(m.sesgo[qid] || 0.5))]; });
      fila['Respuesta abierta'] = i % 5 === 0 ? abiertas[(i / 5 + (m.n % 3)) % abiertas.length | 0] : '';
      datos.push(fila);
    }
  });
  return datos;
}

// CARGA DE DATOS
// ─────────────────────────────────────────────
let RESPUESTAS = [];
let MODO_EJEMPLO = false;
let vista = null;          // key del pulso que se está viendo, o 'comparar'
let cmpA = null, cmpB = null;
let filtroActual = 'todos';
let filtroPorPregunta = {};

async function cargarDatos() {
  const content = document.getElementById('content-area');
  content.innerHTML = '<div class="loading">Cargando datos…</div>';
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?key=' + encodeURIComponent(CLAVE_SECRETA));
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'Error desconocido');
    RESPUESTAS = data.respuestas || [];
    MODO_EJEMPLO = false;
    document.getElementById('last-update').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  } catch (err) {
    MODO_EJEMPLO = true;
    RESPUESTAS = generarDatosEjemplo();
    document.getElementById('last-update').textContent = 'Sin conexión — mostrando ejemplo';
  }
  PULSOS = construirPulsos(RESPUESTAS);
  const ok = pulsosOk();
  if (!vista || (vista !== 'comparar' && !PULSOS.some(p => p.key === vista))) vista = ok.length ? ok[ok.length - 1].key : (PULSOS[0] ? PULSOS[0].key : null);
  cmpA = null; cmpB = null;
  render();
}

function cambiarVista(v) { vista = v; filtroActual = 'todos'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function tabsHtml() {
  const ok = pulsosOk();
  const mesCorto = p => p.label.split(' ')[0];
  return `<div class="vista-tabs">
    ${PULSOS.map(p => `<button class="vista-tab ${vista === p.key ? 'active' : ''}" style="${vista === p.key ? `background:${p.col.main}; border-color:${p.col.main}; color:${p.col.tinta};` : `border-left:5px solid ${p.col.main};`}" onclick="cambiarVista('${p.key}')">${p.esOtro ? 'Sin identificar' : (p.label.startsWith('Pulso') ? escapeHtml(p.label) : mesCorto(p))}<small>${escapeHtml(p.bloque || '')}${p.ciclo ? ' · ' + escapeHtml(p.ciclo) : ''} · ${p.filas.length} resp.</small></button>`).join('')}
    ${ok.length >= 1 ? `<button class="vista-tab comparar ${vista === 'comparar' ? 'active' : ''}" onclick="cambiarVista('comparar')">⇄ Comparar meses<small>Cómo se mueve cada mes</small></button>` : ''}

}

function render() {
  const content = document.getElementById('content-area');
  if (!PULSOS.length) {
    content.innerHTML = '<div class="card"><div class="sin-datos">Todavía no hay respuestas en la hoja.</div></div>';
    return;
  }
  let html = '';
  if (MODO_EJEMPLO) html += `<div class="error-box" style="margin-bottom:18px;">⚠ Estás viendo <strong>datos de ejemplo (ficticios)</strong>, solo para revisar el diseño. Aún no está conectado a tu Google Sheet real.</div>`;
  html += tabsHtml();

  if (vista === 'comparar') {
    document.getElementById('brand-dept').textContent = 'Panel de seguimiento · Comparar meses';
    html += renderComparativo();
  } else {
    const p = PULSOS.find(x => x.key === vista) || PULSOS[0];
    document.getElementById('brand-dept').textContent = 'Panel de seguimiento · ' + p.label + (p.bloque ? ' · ' + p.bloque : '');
    html += renderPulso(p);
  }
  html += `<div class="privacy-note">
    Este panel solo muestra datos agregados por nivel de puesto, nunca por área ni con datos que permitan identificar a una persona. Acceso restringido a Recursos Humanos y Dirección General.<br>
    <span style="color:var(--ink-muted);">Cada mes se lee por separado: ${AGRUPADO.porMes} respuestas se ubicaron por la columna «Mes» de la hoja${AGRUPADO.porBloque ? `, ${AGRUPADO.porBloque} por el bloque detectado en sus respuestas` : ''}${AGRUPADO.sinIdentificar ? `, ${AGRUPADO.sinIdentificar} no se pudieron ubicar` : ''}.</span>
  </div>`;
  content.innerHTML = html;
}

// ───────────── Vista de UN mes ─────────────
function renderPulso(p) {
  const filas = p.filas;
  const total = filas.length;
  const META = getMeta();
  const pct = Math.min(100, Math.round(total / META * 100));
  const conteo = {}; NIVELES.forEach(n => conteo[n.key] = 0);
  let otros = 0;
  filas.forEach(f => { if (conteo.hasOwnProperty(f.nivel)) conteo[f.nivel]++; else otros++; });
  const maxNivel = Math.max(1, ...Object.values(conteo));

  const filtradas = filtroActual === 'todos' ? filas : filas.filter(f => f.nivel === filtroActual);
  let html = `
  <div class="page-title">${escapeHtml(p.label)}</div>
  <div class="page-sub">${p.bloque ? `Bloque profundo: <strong>${escapeHtml(p.bloque)}</strong>` : ''}${p.ciclo ? ' · ' + escapeHtml(p.ciclo) : ''} · Solo respuestas de este mes</div>

  <div class="card">
    <div class="card-tag"><span class="dot"></span>Participación</div>
    <div class="participacion-grid">
      <div>
        <h2>Respuestas recibidas</h2>
        <div class="big-number">${total} <small>/ ${META}</small><button class="meta-edit-btn" onclick="editarMeta()" title="Editar meta de colaboradores">✎</button></div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><strong>${pct}%</strong> de avance sobre ${META} colaboradores</div>
      </div>
      <div>
        ${NIVELES.map(n => `<div class="nivel-row"><div class="nivel-name">${n.label}</div><div class="nivel-bar-wrap"><div class="nivel-bar-fill" style="width:${conteo[n.key] / maxNivel * 100}%"></div></div><div class="nivel-count">${conteo[n.key]}</div></div>`).join('')}
        ${otros > 0 ? `<div class="nivel-row"><div class="nivel-name">Sin clasificar</div><div class="nivel-bar-wrap"><div class="nivel-bar-fill" style="width:${otros / maxNivel * 100}%; background:var(--ink-muted)"></div></div><div class="nivel-count">${otros}</div></div>` : ''}
      </div>
    </div>
  </div>`;

  // Semáforo por bloque
  const etiqueta = { verde: '🟢 Bien', amarillo: '🟡 Atención', rojo: '🔴 Alerta' };
  const resumen = calcularResumenBloques(filtradas);
  html += `
  <div class="card">
    <div class="card-tag"><span class="dot"></span>Resumen ejecutivo</div>
    <h2 style="margin-bottom:14px;">¿Cómo viene cada bloque?</h2>
    <div class="resumen-grid">
      ${resumen.map(b => {
        if (b.n === 0) return `<div class="resumen-card"><div class="resumen-nombre">${b.nombre}</div><div class="resumen-detalle sin-datos">Sin datos este mes</div></div>`;
        const profundo = b.nombre === p.bloque;
        let vs = '';
        if (filtroActual === 'todos') {
          const qid = TERMOMETRO[b.nombre];
          const prev = pulsoPrevioCon(p, qid);
          const cur = statsPregunta(p.filas, qid);
          if (prev && cur.n > 0) vs = `<div class="resumen-vs">Termómetro vs ${prev.label.split(' ')[0]}: ${deltaChip(cur.pctPositivo - statsPregunta(prev.filas, qid).pctPositivo)}</div>`;
        }
        return `<div class="resumen-card ${b.color}">
          <div class="resumen-nombre">${b.nombre}${profundo ? ' <span class="deep-mark">◆ profundo</span>' : ''}</div>
          <div class="resumen-badge ${b.color}"><span class="dot-lg"></span>${etiqueta[b.color]}</div>
          <div class="resumen-detalle">${b.pctPositivo}% en zona positiva${b.pctAlerta > 0 ? ` · ${b.pctAlerta}% en alerta` : ''}</div>
          ${vs}
        </div>`;
      }).join('')}
    </div>
    <div class="resumen-nota">◆ Bloque profundo del mes (varias preguntas). Los demás se leen con su pregunta de monitoreo. Para ver la evolución completa, usa «Comparar meses».</div>
  </div>`;

  // Foco por nivel
  const matriz = calcularMatrizNivelBloque(filas);
  const conDatos = matriz.filter(f => f.totalRespuestas > 0);
  const foco = conDatos.find(f => f.rojos > 0 || f.amarillos > 0);
  html += `
  <div class="card">
    <div class="card-tag"><span class="dot"></span>Resumen ejecutivo</div>
    <h2 style="margin-bottom:14px;">¿En qué nivel hay que poner foco?</h2>
    ${foco ? `<div class="foco-banner">📍 <strong>Foco sugerido: ${foco.nivel}</strong> — es el nivel con más bloques en zona de atención (${foco.rojos} en alerta roja, ${foco.amarillos} en amarilla). Los bloques a revisar primero son: <strong>${foco.bloques.filter(b => b.color === 'rojo' || b.color === 'amarillo').map(b => b.nombre).join(', ')}</strong>.</div>` : `<div class="foco-banner">✓ Por ahora ningún nivel muestra bloques en zona de alerta o atención.</div>`}
    <div class="tabla-matriz-wrap"><table class="tabla-matriz">
      <thead><tr><th>Nivel de puesto</th>${BLOQUES_ORDEN.map(b => `<th>${b}</th>`).join('')}</tr></thead>
      <tbody>
      ${matriz.map(fila => `<tr>
        <td>${fila.nivel}${fila.totalRespuestas > 0 ? ` <span style="color:var(--ink-muted); font-weight:400;">(${fila.totalRespuestas})</span>` : ''}</td>
        ${fila.bloques.map(b => b.n === 0 ? `<td><span class="matriz-dot gris">–</span></td>` : `<td><div class="matriz-cell-wrap"><span class="matriz-dot ${b.color}"></span><span class="matriz-pct">${b.pctPositivo}%${b.pctAlerta > 0 ? ` · ${b.pctAlerta}% alerta` : ''}</span></div></td>`).join('')}
      </tr>`).join('')}
      </tbody></table></div>
    <div class="resumen-nota">El % debajo de cada círculo es la proporción de respuestas en zona positiva para ese bloque y nivel.</div>
  </div>`;

  // Lectura narrativa
  html += `
  <div class="card">
    <div class="card-tag"><span class="dot"></span>Resumen de análisis</div>
    <h2 style="margin-bottom:14px;">Lectura general de ${escapeHtml(p.label.split(' ')[0].toLowerCase())}</h2>
    ${narrativaPulso(p).map(t => `<p style="font-size:13.5px; color:var(--ink-mid); line-height:1.65; margin-bottom:10px;">${t}</p>`).join('')}
  </div>`;

  // Filtro general
  html += `<div class="filtro-wrap"><label>Ver resultados de:</label>
    <select onchange="filtroActual=this.value; render();">
      <option value="todos" ${filtroActual === 'todos' ? 'selected' : ''}>Todos los niveles</option>
      ${NIVELES.map(n => `<option value="${n.key}" ${filtroActual === n.key ? 'selected' : ''}>${n.label}</option>`).join('')}
    </select></div>`;

  // Preguntas: primero el bloque profundo, luego el monitoreo
  const profundas = p.qids.filter(id => Q[id].bloque === p.bloque);
  const monitoreo = p.qids.filter(id => Q[id].bloque !== p.bloque);
  if (profundas.length) {
    html += `<div class="seccion-titulo">Bloque profundo · ${escapeHtml(p.bloque || '')}</div>`;
    profundas.forEach(id => { html += htmlPregunta(p, id, false); });
  }
  if (monitoreo.length) {
    html += `<div class="seccion-titulo">Monitoreo general · una pregunta de cada uno de los otros bloques</div>`;
    monitoreo.forEach(id => { html += htmlPregunta(p, id, true); });
  }

  // Respuestas abiertas: lectura por temas, tono y alertas
  html += htmlAbiertas(p, filtradas);
  return html;
}

function htmlPregunta(p, qid, esMonitoreo) {
  const q = Q[qid];
  const filtro = filtroPorPregunta[qid] || 'todos';
  const base = filtro === 'todos' ? p.filas : p.filas.filter(f => f.nivel === filtro);
  const valores = idxDe(base, qid);
  const n = valores.length;

  let vs = '';
  const prev = pulsoPrevioCon(p, qid);
  if (prev) {
    const a = statsPregunta(prev.filas, qid), b = statsPregunta(p.filas, qid);
    vs = `<div class="vs-prev">vs ${escapeHtml(prev.label.split(' ')[0])} (todos los niveles): ${a.pctPositivo}% → ${b.pctPositivo}% en zona positiva ${deltaChip(b.pctPositivo - a.pctPositivo)}</div>`;
  }

  let html = `
  <div class="card">
    <div class="pregunta-header">
      <span class="pregunta-bloque">${q.bloque} <em>· ${esMonitoreo ? 'Monitoreo' : q.tipo}</em></span>
      <span class="pregunta-n">${n} respuesta${n === 1 ? '' : 's'}</span>
    </div>
    <div class="pregunta-txt">${escapeHtml(q.texto)}</div>
    ${vs}
    <div class="pregunta-filtro"><label>Ver resultados de:</label>
      <select onchange="filtroPorPregunta['${qid}']=this.value; render();">
        <option value="todos" ${filtro === 'todos' ? 'selected' : ''}>Todos los niveles</option>
        ${NIVELES.map(nv => `<option value="${nv.key}" ${filtro === nv.key ? 'selected' : ''}>${nv.label}</option>`).join('')}
      </select></div>`;
  if (n === 0) {
    html += `<div class="sin-datos">Aún no hay respuestas para esta pregunta con el filtro actual.</div>`;
  } else {
    const conteos = [0, 1, 2, 3].map(i => valores.filter(v => v === i).length);
    const maxC = Math.max(1, ...conteos);
    html += `<div class="barras-vert">`;
    q.opciones.forEach((op, i) => {
      const c = conteos[i];
      const alt = Math.max(2, Math.round(c / maxC * 120));
      const desglose = NIVELES.map(nv => ({ label: nv.label, c: base.filter(f => f.resp[qid] === i && f.nivel === nv.key).length }))
        .filter(x => x.c > 0).sort((a, b) => b.c - a.c).map(x => `${x.c} ${x.label}`).join('\n');
      html += `<div class="barra-col" title="${escapeHtml(desglose || 'Sin respuestas')}">
        <div class="barra-pct">${Math.round(c / n * 100)}%</div>
        <div class="barra-cuenta">(${c})</div>
        <div class="barra-vert-fill" style="height:${alt}px; background:${COLORES_OPCION[i]}"></div>
        <div class="barra-op-label">Op. ${i + 1}</div></div>`;
    });
    html += `</div><div class="leyenda-opciones">`;
    q.opciones.forEach((op, i) => { html += `<div class="leyenda-item"><span class="leyenda-dot" style="background:${COLORES_OPCION[i]}"></span><div><b>Op. ${i + 1}:</b> ${escapeHtml(op)}</div></div>`; });
    html += `</div>`;
  }
  return html + `</div>`;
}

function narrativaPulso(p) {
  const filas = p.filas, total = filas.length, META = getMeta();
  if (!total) return ['Todavía no hay respuestas suficientes para generar un análisis.'];
  const out = [`Este mes se recibieron <strong>${total} respuestas</strong> (${Math.round(total / META * 100)}% de avance sobre ${META} colaboradores).`];
  const bloques = calcularResumenBloques(filas).filter(b => b.n > 0).sort((a, b) => b.pctPositivo - a.pctPositivo);
  if (bloques.length > 1) {
    const mej = bloques[0], peor = bloques[bloques.length - 1];
    out.push(`El bloque que viene mejor es <strong>${mej.nombre}</strong> (${mej.pctPositivo}% en zona positiva), mientras que <strong>${peor.nombre}</strong> es el que más atención requiere (${peor.pctPositivo}% en zona positiva${peor.pctAlerta > 0 ? `, ${peor.pctAlerta}% en alerta` : ''}).`);
  }
  const preg = p.qids.map(id => Object.assign({ id }, statsPregunta(filas, id))).filter(s => s.n > 0).sort((a, b) => b.pctPositivo - a.pctPositivo);
  if (preg.length > 1) {
    out.push(`A nivel de pregunta específica, la mejor percepción se da en "${escapeHtml(Q[preg[0].id].texto)}" (${preg[0].pctPositivo}% positivo), y la que necesita más foco es "${escapeHtml(Q[preg[preg.length - 1].id].texto)}" (${preg[preg.length - 1].pctPositivo}% positivo).`);
  }
  const ra = resumenAbiertas(filas);
  if (ra.n) {
    const top = ra.temas.slice(0, 3).map(x => `<strong>${x.t.nombre}</strong>`).join(', ');
    const conQueja = ra.tono.negativo + ra.tono.mixto;
    out.push(`En los ${ra.n} comentarios abiertos, los temas que más aparecen son ${top}. ${conQueja ? `${Math.round(conQueja / ra.n * 100)}% de los comentarios trae alguna queja o preocupación` : 'Casi ningún comentario trae quejas'}${ra.sugerencias ? `, y ${ra.sugerencias} incluye${ra.sugerencias === 1 ? '' : 'n'} una idea o propuesta` : ''}.`);
  }
  const al = alertasDePulso(p);
  if (al.length) out.push(`Hay <strong>${al.length} comentario${al.length === 1 ? '' : 's'}</strong> que conviene leer con cuidado (ver «Para leer con cuidado» más abajo).`);
  return out;
}

function toggleAbiertas() {
  const lista = document.getElementById('lista-abiertas');
  const btn = document.getElementById('btn-toggle-abiertas');
  const visible = lista.style.display === 'block';
  lista.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? btn.textContent.replace('Ocultar', 'Ver') : btn.textContent.replace('Ver las', 'Ocultar las');
}

// ───────────── Vista COMPARAR MESES ─────────────
function renderComparativo() {
  const ok = pulsosOk();
  const META = getMeta();
  let html = `<div class="page-title">Comparar meses</div>
  <div class="page-sub">Cada mes se calcula por separado y aquí se ponen lado a lado. Se comparan las mismas preguntas, sin mezclar respuestas de un mes con otro.</div>`;

  // Participación (todos los meses)
  const maxN = Math.max(META, ...ok.map(p => p.filas.length));
  html += `<div class="card">
    <div class="card-tag"><span class="dot"></span>Participación por mes</div>
    <h2 style="margin-bottom:14px;">¿Cuántas personas respondieron cada mes?</h2>
    ${ok.map(p => `<div class="part-row">
      <div class="part-mes">${chipMes(p, p.label)}<small>${escapeHtml(p.bloque || '')}${p.ciclo ? ' · ' + escapeHtml(p.ciclo) : ''}</small></div>
      <div class="part-bar-wrap" style="background:${p.col.xl};"><div class="part-bar-fill" style="width:${p.filas.length / maxN * 100}%; background:${p.col.main};"></div></div>
      <div class="part-num">${p.filas.length} <small>· ${Math.round(p.filas.length / META * 100)}%</small></div>
    </div>`).join('')}
    <div class="resumen-nota">El % es sobre ${META} colaboradores. Si un mes responde menos gente, sus resultados se leen con un poco más de cuidado.</div>
  </div>`;

  // Termómetro por bloque a lo largo de los meses
  html += `<div class="card">
    <div class="card-tag"><span class="dot"></span>Evolución por bloque</div>
    <h2 style="margin-bottom:4px;">El termómetro de cada bloque, mes a mes</h2>
    <div class="resumen-nota" style="margin:0 0 14px;">Para que la comparación sea justa se mira la misma pregunta cada mes: la primera pregunta fija de cada bloque (se hace todos los meses, ya sea como pregunta profunda o de monitoreo). ◆ marca el mes en que ese bloque fue el profundo.</div>
    <div class="tabla-matriz-wrap"><table class="tabla-cmp">
      <thead><tr><th>Bloque</th>${ok.map(p => thMes(p, escapeHtml(p.bloque || ''))).join('')}</tr></thead>
      <tbody>
      ${BLOQUES_ORDEN.map(b => {
        const qid = TERMOMETRO[b];
        let prevPct = null;
        const celdas = ok.map(p => {
          const s = statsPregunta(p.filas, qid);
          if (s.n === 0) return `<td><span class="matriz-dot gris">–</span></td>`;
          const chip = prevPct !== null ? deltaChip(s.pctPositivo - prevPct) : '';
          prevPct = s.pctPositivo;
          return `<td><div class="matriz-cell-wrap"><span class="matriz-dot ${s.color}"></span><span class="matriz-pct">${s.pctPositivo}% positivo${s.pctAlerta > 0 ? ` · ${s.pctAlerta}% alerta` : ''}</span>${chip}</div></td>`;
        }).join('');
        return `<tr><td>${b}</td>${celdas}</tr>`;
      }).join('')}
      </tbody></table></div>
    <div class="resumen-nota">Pregunta que se sigue en cada bloque: ${BLOQUES_ORDEN.map(b => `<strong>${b}</strong> — “${escapeHtml(Q[TERMOMETRO[b]].texto)}”`).join(' · ')}</div>
  </div>`;

  if (ok.length < 2) {
    html += `<div class="card"><div class="sin-datos">Cuando tengas respuestas de un segundo mes, aquí vas a ver qué preguntas subieron, cuáles bajaron y cómo se mueve cada nivel de puesto.</div></div>`;
    return html;
  }

  // Selector de par de meses
  if (!cmpA || !cmpB || !ok.some(p => p.key === cmpA) || !ok.some(p => p.key === cmpB)) { cmpA = ok[ok.length - 2].key; cmpB = ok[ok.length - 1].key; }
  const A = ok.find(p => p.key === cmpA), B = ok.find(p => p.key === cmpB);
  const opts = sel => ok.map(p => `<option value="${p.key}" ${p.key === sel ? 'selected' : ''}>${escapeHtml(p.label)}</option>`).join('');
  html += `<div class="cmp-bar">Comparar
    <select class="cmp-select" style="border-left:6px solid ${A.col.main};" onchange="cmpA=this.value; render();">${opts(cmpA)}</select>
    con <select class="cmp-select" style="border-left:6px solid ${B.col.main};" onchange="cmpB=this.value; render();">${opts(cmpB)}</select></div>`;

  // Preguntas que se hicieron en ambos meses
  const comunes = CATALOGO.map(q => q.id).filter(id => statsPregunta(A.filas, id).n > 0 && statsPregunta(B.filas, id).n > 0);
  const movs = comunes.map(id => {
    const a = statsPregunta(A.filas, id), b = statsPregunta(B.filas, id);
    return { id, a, b, delta: b.pctPositivo - a.pctPositivo };
  }).sort((x, y) => x.delta - y.delta);
  const bajan = movs.filter(m => m.delta <= -UMBRAL_MOVIMIENTO);
  const suben = movs.filter(m => m.delta >= UMBRAL_MOVIMIENTO).reverse();
  const estables = movs.filter(m => Math.abs(m.delta) < UMBRAL_MOVIMIENTO);

  // Lectura
  const lectura = [];
  lectura.push(`En <strong>${escapeHtml(B.label)}</strong> respondieron <strong>${B.filas.length}</strong> personas (${Math.round(B.filas.length / META * 100)}%), frente a ${A.filas.length} en ${escapeHtml(A.label)}.`);
  if (!movs.length) lectura.push('Estos dos meses no compartieron preguntas, así que por ahora no hay un movimiento que comparar.');
  else {
    const pl = (n, s, p) => n === 1 ? `1 ${s}` : `${n} ${p}`;
    lectura.push(`Hay <strong>${movs.length} pregunta${movs.length === 1 ? '' : 's'}</strong> que se hicieron en ambos meses: ${pl(bajan.length, 'bajó', 'bajaron')}, ${pl(suben.length, 'mejoró', 'mejoraron')} y ${pl(estables.length, 'se mantuvo estable', 'se mantuvieron estables')} (menos de ${UMBRAL_MOVIMIENTO} puntos de diferencia).`);
    if (bajan.length) { const m = bajan[0]; lectura.push(`Lo que más bajó: “${escapeHtml(Q[m.id].texto)}” (${Q[m.id].bloque}), de ${m.a.pctPositivo}% a ${m.b.pctPositivo}% en zona positiva.`); }
    if (suben.length) { const m = suben[0]; lectura.push(`Lo que más mejoró: “${escapeHtml(Q[m.id].texto)}” (${Q[m.id].bloque}), de ${m.a.pctPositivo}% a ${m.b.pctPositivo}%.`); }
    if (!bajan.length && !suben.length) lectura.push('En general, los indicadores se mantuvieron parecidos entre ambos meses.');
    lectura.push('Con grupos pequeños, unos pocos puntos de diferencia pueden ser solo variación normal; conviene leerlos como tendencia y contrastarlos con lo que cuentan las respuestas abiertas.');
  }
  const rA = resumenAbiertas(A.filas), rB = resumenAbiertas(B.filas);
  if (rA.n >= MIN_COMENTARIOS && rB.n >= MIN_COMENTARIOS) {
    const cambios = TEMAS.map(t => ({ t, a: Math.round(rA.porTema[t.id].n / rA.n * 100), b: Math.round(rB.porTema[t.id].n / rB.n * 100) }))
      .map(x => Object.assign(x, { d: x.b - x.a })).sort((x, y) => y.d - x.d);
    if (cambios[0].d >= UMBRAL_MOVIMIENTO) lectura.splice(lectura.length - 1, 0, `En los comentarios abiertos creció la conversación sobre <strong>${cambios[0].t.nombre}</strong> (de ${cambios[0].a}% a ${cambios[0].b}% de los comentarios).`);
  }
  const alB = alertasDePulso(B);
  if (alB.length) lectura.splice(lectura.length - 1, 0, `En ${escapeHtml(B.label.split(' ')[0])} hay <strong>${alB.length} comentario${alB.length === 1 ? '' : 's'}</strong> que conviene leer con cuidado (se ven en la pestaña de ese mes).`);
  html += `<div class="card"><div class="card-tag"><span class="dot"></span>Lectura del movimiento</div>
    <h2 style="margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">${chipMes(A)} <span style="color:var(--ink-muted);">→</span> ${chipMes(B)}</h2>
    ${lectura.map(t => `<p style="font-size:13.5px; color:var(--ink-mid); line-height:1.65; margin-bottom:10px;">${t}</p>`).join('')}</div>`;

  // Lista de movimientos
  const itemMov = (m, clase) => `<div class="mov-item ${clase}">
      <div class="mov-top"><span class="pregunta-bloque">${Q[m.id].bloque} <em>· ${Q[m.id].bloque === A.bloque || Q[m.id].bloque === B.bloque ? Q[m.id].tipo : 'Monitoreo'}</em></span>${deltaChip(m.delta)}</div>
      <div class="mov-txt">${escapeHtml(Q[m.id].texto)}</div>
      <div class="mov-nums">${chipMes(A)} <strong>${m.a.pctPositivo}%</strong> positivo${m.a.pctAlerta ? ` · ${m.a.pctAlerta}% alerta` : ''} &nbsp;→&nbsp; ${chipMes(B)} <strong>${m.b.pctPositivo}%</strong> positivo${m.b.pctAlerta ? ` · ${m.b.pctAlerta}% alerta` : ''}</div>
    </div>`;
  html += `<div class="card"><div class="card-tag"><span class="dot"></span>Qué se movió</div>
    <h2 style="margin-bottom:14px;">Preguntas que se hicieron en ambos meses</h2>
    ${movs.length === 0 ? '<div class="sin-datos">No hay preguntas en común entre estos dos meses.</div>' : ''}
    ${bajan.length ? `<div class="mov-grupo"><div class="mov-grupo-titulo">▼ Bajaron — vale la pena mirarlas con calma</div>${bajan.map(m => itemMov(m, 'baja')).join('')}</div>` : ''}
    ${suben.length ? `<div class="mov-grupo"><div class="mov-grupo-titulo">▲ Mejoraron — algo está funcionando</div>${suben.map(m => itemMov(m, 'sube')).join('')}</div>` : ''}
    ${estables.length ? `<div class="mov-grupo"><div class="mov-grupo-titulo">≈ Se mantuvieron estables</div><div class="mov-estables">${estables.map(m => `• ${escapeHtml(Q[m.id].texto)} — ${m.a.pctPositivo}% → ${m.b.pctPositivo}%`).join('<br>')}</div></div>` : ''}
  </div>`;

  // Por nivel
  const poolPos = (filas, ids) => { const idx = ids.flatMap(id => idxDe(filas, id)); return idx.length ? Math.round(idx.filter(i => i <= 1).length / idx.length * 100) : null; };
  html += `<div class="card"><div class="card-tag"><span class="dot"></span>Por nivel de puesto</div>
    <h2 style="margin-bottom:4px;">¿Cómo se movió cada nivel?</h2>
    <div class="resumen-nota" style="margin:0 0 14px;">% en zona positiva sumando las ${comunes.length} preguntas que se hicieron en ambos meses. Los grupos con menos de ${MIN_N_NIVEL} personas no se muestran, para cuidar el anonimato.</div>
    <table class="tabla-cmp"><thead><tr><th>Nivel</th>${thMes(A)}${thMes(B)}<th>Movimiento</th></tr></thead><tbody>
    ${NIVELES.map(nv => {
      const fa = A.filas.filter(f => f.nivel === nv.key), fb = B.filas.filter(f => f.nivel === nv.key);
      if (fa.length < MIN_N_NIVEL || fb.length < MIN_N_NIVEL || !comunes.length) return `<tr><td>${nv.label}</td><td colspan="3" class="celda-prot">Grupo pequeño en alguno de los meses: no se muestra</td></tr>`;
      const pa = poolPos(fa, comunes), pb = poolPos(fb, comunes);
      return `<tr><td>${nv.label}</td><td>${pa}%<span class="celda-n">${fa.length} personas</span></td><td>${pb}%<span class="celda-n">${fb.length} personas</span></td><td>${deltaChip(pb - pa)}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;

  html += comparativoAbiertas(ok, A, B);
  return html;
}
</script>
</body>
</html>
