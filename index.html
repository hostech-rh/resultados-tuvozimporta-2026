<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tu voz importa — Resultados — Hostech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f6f5ec; font-family: 'IBM Plex Sans', sans-serif; color: #111118;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #ffffff; border-radius: 24px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
          box-shadow: 0 1px 2px rgba(17,17,24,0.06); }
  .tag { display: inline-block; background: #111118; color: #FAD83F; font-weight: 600; font-size: 12px; letter-spacing: 0.04em;
         padding: 6px 12px; border-radius: 999px; margin-bottom: 20px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin: 0 0 8px; }
  p { color: #6b6b76; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  #msg { margin: 20px 0 0; font-size: 13.5px; color: #111118; min-height: 20px; }
  #msg.err { color: #C40E91; }
  .bar { height: 4px; width: 64px; margin: 28px auto 0; border-radius: 4px; background: linear-gradient(90deg, #4563FF 0 50%, #FAD83F 50% 100%); }
</style>
</head>
<body>
<div class="card">
  <div class="tag">HOSTECH · RH</div>
  <h1>Tu voz importa · Resultados</h1>
  <p>Contenido confidencial. Entra con tu cuenta de Hostech autorizada.</p>
  <div id="gbtn"></div>
  <div id="msg"></div>
  <div class="bar"></div>
</div>

<script>
(function () {
  var CLIENT_ID = '504943309492-6o8t442avqc27erqpt37ro2spt1ec0uu.apps.googleusercontent.com';
  var API = 'https://script.google.com/macros/s/AKfycbwNHeokK808clIxbqB1Li6qi9MrgInZM9qf_-gdMOmJ3UxB-OsMKtAFlr0sWXvk6jHR/exec';
  var LLAVE = 'hostech_id_token';

  function mensaje(texto, esError) {
    var el = document.getElementById('msg');
    el.textContent = texto;
    el.className = esError ? 'err' : '';
  }

  function tokenVigente(token) {
    try {
      var datos = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return datos.exp * 1000 > Date.now() + 60000;
    } catch (e) { return false; }
  }

  function cargar(token) {
    mensaje('Cargando resultados…');
    fetch(API + '?action=page&id_token=' + encodeURIComponent(token), { redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error === 'no_autorizado') {
          try { sessionStorage.removeItem(LLAVE); } catch (e) {}
          mensaje('La cuenta ' + res.email + ' no tiene acceso. Pídeselo a Recursos Humanos.', true);
          return;
        }
        if (res.error || !res.html) {
          try { sessionStorage.removeItem(LLAVE); } catch (e) {}
          mensaje('Tu sesión expiró. Vuelve a iniciar sesión.', true);
          return;
        }
        try { sessionStorage.setItem(LLAVE, token); } catch (e) {}
        document.open();
        document.write(res.html);
        document.close();
      })
      .catch(function () {
        mensaje('No se pudo conectar. Revisa tu internet e intenta de nuevo.', true);
      });
  }

  window.__hostechInit = function () {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: function (resp) { cargar(resp.credential); },
      auto_select: true,
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'), {
      theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'es',
    });

    var guardado = null;
    try { guardado = sessionStorage.getItem(LLAVE); } catch (e) {}
    if (guardado && tokenVigente(guardado)) {
      cargar(guardado);
    } else {
      google.accounts.id.prompt();
    }
  };
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="__hostechInit()"></script>
</body>
</html>
